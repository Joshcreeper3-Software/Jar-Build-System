name: Build and Package Installers

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual triggering

jobs:
  # Windows Build
  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create Windows EXE Installer
        run: |
          jpackage --type exe `
            --input . `
            --name BlockCraft-3D `
            --main-jar BlockCraft-3D.jar `
            --main-class com.blockcraft-3d.Main `
            --win-menu `
            --win-shortcut

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: BlockCraft-3D-Windows
          path: ./*.exe

  # macOS Build
  build-macos:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create macOS DMG Installer
        run: |
          jpackage --type dmg \
            --input . \
            --name BlockCraft-3D \
            --main-jar BlockCraft-3D.jar \
            --main-class com.blockcraft-3d.Main

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: BlockCraft-3D-macOS
          path: ./*.dmg

  # Linux Build
  build-linux:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      - name: Create Linux AppImage
        run: |
          jpackage --type app-image \
            --input . \
            --name BlockCraft-3D \
            --main-jar BlockCraft-3D.jar \
            --main-class com.blockcraft-3d.Main

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: BlockCraft-3D-Linux
          path: ./BlockCraft-3D/
